# A pushed tag v* becomes a GitHub release whose notes are the section of that version in CHANGELOG.md, once the checks
# of CI pass on it. Run by hand, it makes the release of an existing tag, with CHANGELOG.md of the chosen branch.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Notes from CHANGELOG.md
        run: |
          awk -v head="## [${TAG#v}]" 'index($0, "## [") == 1 { p = index($0, head) == 1; next } p && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $TAG" >&2; exit 1; }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
